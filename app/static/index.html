<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocuBot Chat</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e4e4df;
    --accent: #2f6f4f; --accent-text: #ffffff; --user: #e8f0eb; --memory: #fbf7e9; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161715; --panel: #1f201e; --text: #ececea; --muted: #9a9a94; --border: #33342f;
      --accent: #5fae86; --accent-text: #0e1a13; --user: #243229; --memory: #2a2719; --danger: #f2867e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }

  aside {
    width: 270px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .brand { padding: 16px 16px 4px; font-weight: 650; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .new { margin: 12px 16px; padding: 9px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
  #threads { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1; }
  #threads li {
    display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
    white-space: nowrap; overflow: hidden;
  }
  #threads li span { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #threads li.active, #threads li:hover { background: var(--user); }
  #threads li button { border: 0; background: none; color: var(--muted); padding: 0 4px; visibility: hidden; }
  #threads li:hover button, #threads li.active button { visibility: visible; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu { display: none; border: 1px solid var(--border); background: none; color: var(--text); border-radius: 6px; padding: 2px 9px; }
  #memoryToggle { border: 1px solid var(--border); background: none; color: var(--text); border-radius: 999px; padding: 3px 12px; font-size: 13px; }

  #memory { display: none; background: var(--memory); border-bottom: 1px solid var(--border); padding: 12px 20px; font-size: 13px; max-height: 35vh; overflow-y: auto; }
  #memory.open { display: block; }
  #memory h2 { font-size: 13px; margin: 0 0 6px; }
  #memory pre { white-space: pre-wrap; font: inherit; margin: 0; }
  #memory .hint { color: var(--muted); margin-top: 8px; }

  #log { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .msg { max-width: 760px; margin: 0 auto 14px; display: flex; }
  .msg div { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 85%; }
  .msg.user { justify-content: flex-end; }
  .msg.user div { background: var(--user); }
  .msg.assistant div { background: var(--panel); border: 1px solid var(--border); }
  .msg.folded div { opacity: .55; }
  .msg.error div { color: var(--danger); background: none; border: 1px dashed var(--danger); }
  .empty { max-width: 520px; margin: 12vh auto 0; text-align: center; color: var(--muted); }
  .empty h2 { color: var(--text); font-size: 20px; }

  form { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px; }
  .row { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 180px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
  }
  form button { border: 0; border-radius: 10px; padding: 10px 16px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
  form button:disabled { opacity: .5; cursor: default; }

  @media (max-width: 720px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 24px rgba(0,0,0,.2); }
    aside.open { transform: none; }
    #menu { display: block; }
    header, #log, form, #memory { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">DocuBot Chat<small>Saved threads · long-term memory</small></div>
  <button class="new" id="newChat">+ New chat</button>
  <ul id="threads"></ul>
</aside>

<main>
  <header>
    <button id="menu" aria-label="Show chats">☰</button>
    <h1 id="title">New chat</h1>
    <button id="memoryToggle">Memory</button>
  </header>
  <section id="memory">
    <h2>Long-term memory</h2>
    <pre id="summary"></pre>
    <div class="hint" id="memoryHint"></div>
  </section>
  <div id="log"></div>
  <form id="composer">
    <div class="row">
      <textarea id="input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for a new line)" maxlength="4000"></textarea>
      <button id="send">Send</button>
    </div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
let visitorId;
try {
  visitorId = localStorage.getItem("visitorId");
  if (!visitorId) { visitorId = crypto.randomUUID(); localStorage.setItem("visitorId", visitorId); }
} catch { visitorId = crypto.randomUUID(); }

let current = null;
let busy = false;

async function api(path, options = {}) {
  const res = await fetch(`/chat/api${path}`, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Visitor-Id": visitorId, ...options.headers },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(typeof body.detail === "string" ? body.detail : `Request failed (${res.status})`);
  }
  return res.status === 204 ? null : res.json();
}

function bubble(role, text, extra = "") {
  const row = document.createElement("div");
  row.className = `msg ${role} ${extra}`;
  const div = document.createElement("div");
  div.textContent = text;
  row.appendChild(div);
  $("log").appendChild(row);
  $("log").scrollTop = $("log").scrollHeight;
  return row;
}

function showEmpty() {
  $("log").innerHTML = `<div class="empty"><h2>Conversations that don't forget</h2>
    <p>Every thread is saved, so you can close the tab and pick up tomorrow.
    When a thread gets long, older messages are condensed into a long-term memory
    instead of being dropped. Open <b>Memory</b> to see what's remembered.</p></div>`;
}

function renderMemory(summary, summarizedUpto, messages) {
  const folded = messages.filter((m) => m.id <= summarizedUpto).length;
  $("summary").textContent = summary || "Nothing condensed yet. Memory kicks in once the thread gets long.";
  $("memoryHint").textContent = folded
    ? `${folded} earlier messages are condensed above; the latest ${messages.length - folded} are sent word for word.`
    : `All ${messages.length} messages are still sent word for word.`;
  $("memoryToggle").textContent = summary ? "Memory ●" : "Memory";
}

async function loadThreads() {
  const threads = await api("/threads");
  const list = $("threads");
  list.innerHTML = "";
  for (const t of threads) {
    const li = document.createElement("li");
    li.className = current && t.id === current.id ? "active" : "";
    const span = document.createElement("span");
    span.textContent = t.title;
    const del = document.createElement("button");
    del.textContent = "✕";
    del.title = "Delete chat";
    del.onclick = async (e) => {
      e.stopPropagation();
      await api(`/threads/${t.id}`, { method: "DELETE" });
      if (current && current.id === t.id) { current = null; $("title").textContent = "New chat"; showEmpty(); renderMemory("", 0, []); }
      loadThreads();
    };
    li.append(span, del);
    li.onclick = () => openThread(t.id);
    list.appendChild(li);
  }
  return threads;
}

async function openThread(id) {
  current = await api(`/threads/${id}`);
  $("title").textContent = current.title;
  $("log").innerHTML = "";
  if (!current.messages.length) showEmpty();
  for (const m of current.messages) bubble(m.role, m.content, m.id <= current.summarized_upto ? "folded" : "");
  renderMemory(current.summary, current.summarized_upto, current.messages);
  $("sidebar").classList.remove("open");
  loadThreads();
}

async function send(text) {
  if (!current) {
    const t = await api("/threads", { method: "POST" });
    current = { ...t, messages: [], summary: "", summarized_upto: 0 };
    $("log").innerHTML = "";
  }
  if (!current.messages.length) $("log").innerHTML = "";
  bubble("user", text);
  const pending = bubble("assistant", "…");
  try {
    const res = await api(`/threads/${current.id}/messages`, { method: "POST", body: JSON.stringify({ content: text }) });
    pending.remove();
    // Reload so ids, folded styling and the memory panel all reflect the server state.
    await openThread(res.thread.id);
  } catch (err) {
    pending.remove();
    bubble("assistant", err.message, "error");
  }
}

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  busy = true;
  $("send").disabled = true;
  $("input").value = "";
  $("input").style.height = "auto";
  await send(text);
  busy = false;
  $("send").disabled = false;
  $("input").focus();
};
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("input").addEventListener("input", () => {
  $("input").style.height = "auto";
  $("input").style.height = `${$("input").scrollHeight}px`;
});
$("newChat").onclick = () => {
  current = null;
  $("title").textContent = "New chat";
  showEmpty();
  renderMemory("", 0, []);
  $("sidebar").classList.remove("open");
  loadThreads();
  $("input").focus();
};
$("memoryToggle").onclick = () => $("memory").classList.toggle("open");
$("menu").onclick = () => $("sidebar").classList.toggle("open");

(async () => {
  showEmpty();
  renderMemory("", 0, []);
  try {
    const threads = await loadThreads();
    if (threads.length) await openThread(threads[0].id);
  } catch (err) {
    bubble("assistant", err.message, "error");
  }
})();
</script>
</body>
</html>
